server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Healthcheck endpoint
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Reverse proxy for Google Sheets CSV live synchronization (CORS-friendly)
    location /api/sheets-sync {
        resolver 8.8.8.8 1.1.1.1 valid=60s ipv6=off;
        set $upstream_google_sheets "https://docs.google.com/spreadsheets/d/e/2PACX-1vTdwoOQjy8dccue3tQnaDbQv5os6SptjZJ1risMayUjT99z2JCr683c_V9MzGMM2qBEeR6ECVDD4TES/pub?gid=1312885523&single=true&output=csv";
        proxy_pass $upstream_google_sheets;
        proxy_ssl_server_name on;
        proxy_set_header Host docs.google.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # Static assets with caching
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # HTML files - no cache to ensure immediate updates
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Single Page Application fallback
    location / {
        try_files $uri $uri/ /index.html =404;
    }
}
